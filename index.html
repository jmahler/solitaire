<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b4332">
  <title>Solitaire</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="controls-left">
      <select id="game-select" aria-label="Select Solitaire Variant"></select>
      <div id="variant-options" class="variant-options"></div>
      <button id="new-game-btn" type="button">New Deal</button>
    </div>
    <div class="controls-right">

      <span id="status-badge" class="status-badge hidden">No Moves Left</span>
      <span id="move-counter">Moves: 0</span>
      <button id="hint-btn" type="button">Hint</button>
      <button id="undo-btn" type="button" disabled>Undo</button>
    </div>
  </header>

  <main id="board" class="board"></main>

  <div id="win-banner" class="win-banner hidden">
    <div class="win-card">
      <h2>You Won!</h2>
      <p id="win-stats"></p>
      <button id="win-new-game-btn" type="button">Play Again</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
